<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 70 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="wsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="60%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#0052d4" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark Container Background matching Image 5 -->
  <rect x="50" y="70" width="400" height="320" rx="28" fill="#040c1a" stroke="#0072ff" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Icon Frame -->
  <path d="M 215 95 L 345 95 L 345 245 L 280 245" fill="none" stroke="url(#frameGrad)" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)" />
  
  <!-- Icon W Left Wing -->
  <path d="M 148 140 L 202 245 L 255 140" fill="none" stroke="url(#wsGrad)" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter" />
  
  <!-- Icon W Right Wing -->
  <path d="M 230 175 L 255 245 L 318 122" fill="none" stroke="url(#wsGrad)" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter" />
  
  <!-- Text WATTSQUARE -->
  <text x="75" y="325" font-family="'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="44" letter-spacing="4">
    <tspan fill="#0099ff">WATT</tspan><tspan fill="#FFFFFF">SQUARE</tspan>
  </text>
  
  <!-- Subtitle Line & CHARGE HUB -->
  <line x1="75" y1="362" x2="140" y2="362" stroke="#0088ff" stroke-width="3" />
  <text x="250" y="370" font-family="'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="24" fill="#FFFFFF" letter-spacing="9" text-anchor="middle">CHARGE HUB</text>
  <line x1="360" y1="362" x2="425" y2="362" stroke="#0088ff" stroke-width="3" />
</svg>
